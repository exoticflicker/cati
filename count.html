<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cati · 数据</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F2EC;color:#2A2A28;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;padding:36px 0}
.wrap{width:100%;max-width:440px;padding:0 24px}
.head{text-align:center;margin-bottom:32px}
.num{font-size:clamp(64px,16vw,104px);font-weight:700;letter-spacing:-.02em;line-height:1}
.label{margin-top:12px;font-size:13px;letter-spacing:.3em;color:#7C7B76}
.sub{margin-top:18px;font-size:12px;color:#9a988f;letter-spacing:.05em}
.sec-title{font-size:12px;letter-spacing:.2em;color:#9a988f;margin:32px 0 18px}

.cat-chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding:0 4px}
.cat-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cat-bar{width:70%;max-width:26px;background:#2A2A28;transition:height .5s ease}
.cat-pct{font-size:11px;color:#7C7B76;margin-bottom:5px;font-variant-numeric:tabular-nums}
.cat-name{font-size:11px;color:#2A2A28;margin-top:7px;letter-spacing:.05em}

.vote-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #EDEAE2;font-size:14px}
.vote-item .vn{color:#2A2A28}
.vote-item .vc{font-size:13px;color:#7C7B76}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="num" id="num">—</div>
    <div class="label">人 完 成 测 试</div>
    <div class="sub" id="sub">—</div>
  </div>

  <div class="sec-title">各 种 猫 占 比</div>
  <div class="cat-chart" id="dist"></div>

  <div class="sec-title">投 票：下 一 期 做 什 么</div>
  <div id="votes"></div>
</div>
<script>
const DATA = {"completed":{"total":1974366,"daily":56,"up":"11-02 03:47"},"black":{"total":703588,"daily":23,"up":"11-02 03:47"},"golden":{"total":465541,"daily":11,"up":"11-02 03:47"},"silver":{"total":146142,"daily":0,"up":"11-01 04:38"},"cow":{"total":153608,"daily":7,"up":"11-02 03:46"},"ragdoll":{"total":408386,"daily":2,"up":"11-02 00:58"},"siamese":{"total":102963,"daily":4,"up":"11-02 03:47"},"tabby":{"total":159935,"daily":4,"up":"11-02 03:47"},"orange":{"total":208167,"daily":8,"up":"11-02 03:46"},"vote-dogi":{"total":22360,"daily":2,"up":"11-02 03:45"},"vote-xuanxue":{"total":4974,"daily":0,"up":"11-01 04:37"},"vote-gufeng":{"total":11602,"daily":0,"up":"11-01 04:37"},"vote-xiaomao":{"total":702,"daily":0,"up":"11-01 04:05"}};
const CATS=[["black","孟买猫"],["golden","金渐层"],["silver","银渐层"],["cow","奶牛猫"],["ragdoll","布偶"],["siamese","暹罗"],["tabby","狸花"],["orange","橘猫"]];
const VOTES=[["vote-dogi","所有人保持狗塑！测测你的 dogti"],["vote-xuanxue","神煞篇：红艳煞 · 恋爱脑指数"],["vote-gufeng","江湖病犯了 · 看看你主修的门派"],["vote-xiaomao","0.01🥕 向主播许愿 · 小股东"]];
const API_KEY = "sk_live_afd6e949636c37ce34367173c483ad0cefcd89feea0f56fd";
const ITEMS = ["completed","black","golden","silver","cow","ragdoll","siamese","tabby","orange","vote-dogi","vote-xuanxue","vote-gufeng","vote-xiaomao"];
async function refresh(){
  const results = await Promise.all(ITEMS.map(async name=>{
    try{
      const r = await fetch("https://v1.apizero.cn/api/visits-counter?site=exoticflicker-cati&name="+name+"&mode=total&no_increment=1&format=json&api_key="+API_KEY);
      const j = await r.json();
      const d = j && j.data && j.data.record;
      if(d && typeof d.total === "number" && d.total > 0){
        return {name, total:d.total, daily:d.daily, up:(d.updated_at||"").replace("T"," ").slice(5,16)};
      }
    }catch(e){}
    return null;
  }));
  let changed=false;
  for(const item of results){
    if(item){ DATA[item.name]={total:item.total,daily:item.daily,up:item.up}; changed=true; }
  }
  if(changed) render();
}

function render(){
  const completed = DATA.completed || {};
  document.getElementById("num").textContent = completed.total || 0;
  document.getElementById("sub").innerHTML = "今日 +" + (completed.daily||0) + " · 更新于 " + (completed.up||"");

  const totals = CATS.map(([k])=> DATA[k] ? DATA[k].total : 0);
  const sum = totals.reduce((a,b)=>a+b, 0) || 1;
  document.getElementById("dist").innerHTML = CATS.map(([k,n],i)=>{
    const v = totals[i];
    const pct = Math.round(v / sum * 100);
    const h = Math.max(2, Math.round(v / sum * 100));
    return `<div class="cat-col"><div class="cat-pct">${pct}%</div><div class="cat-bar" style="height:${h}%"></div><div class="cat-name">${n}</div></div>`;
  }).join("");

  document.getElementById("votes").innerHTML = VOTES.map(([k,label])=>{
    const v = DATA[k] ? DATA[k].total : 0;
    return `<div class="vote-item"><span class="vn">${label}</span><span class="vc">${v} 票</span></div>`;
  }).join("");
}
render();
refresh();
</script>
</body>
</html>
